version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: marketing_ai_db
    environment:
      POSTGRES_USER: ${DB_USER:-marketing_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-marketing123}
      POSTGRES_DB: ${DB_NAME:-marketing_ai}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-marketing_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - marketing-network

  backend:
    build: .
    container_name: marketing_ai_backend
    environment:
      DEBUG: ${DEBUG:-False}
      APP_NAME: ${APP_NAME:-Marketing AI}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-marketing_ai}
      DB_USER: ${DB_USER:-marketing_user}
      DB_PASSWORD: ${DB_PASSWORD:-marketing123}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN:-}
      GOOGLE_ADS_CLIENT_ID: ${GOOGLE_ADS_CLIENT_ID:-}
      GOOGLE_ADS_CLIENT_SECRET: ${GOOGLE_ADS_CLIENT_SECRET:-}
      GOOGLE_ADS_REFRESH_TOKEN: ${GOOGLE_ADS_REFRESH_TOKEN:-}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${GOOGLE_ADS_LOGIN_CUSTOMER_ID:-}
      GOOGLE_ADS_CUSTOMER_ID: ${GOOGLE_ADS_CUSTOMER_ID:-}
      GOOGLE_SEARCH_CONSOLE_ACCESS_TOKEN: ${GOOGLE_SEARCH_CONSOLE_ACCESS_TOKEN:-}
      GOOGLE_SEARCH_CONSOLE_REFRESH_TOKEN: ${GOOGLE_SEARCH_CONSOLE_REFRESH_TOKEN:-}
      GOOGLE_SEARCH_CONSOLE_SITE_URL: ${GOOGLE_SEARCH_CONSOLE_SITE_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - marketing-network
    restart: unless-stopped

volumes:
  db_data:

networks:
  marketing-network:
    driver: bridge
