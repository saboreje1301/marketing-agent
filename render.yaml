services:
  - type: web
    name: marketing-ai
    runtime: docker
    region: oregon
    plan: free
    dockerfile: ./Dockerfile
    envVars:
      - key: DEBUG
        value: "False"
      - key: APP_NAME
        value: "Marketing AI"
      - key: GOOGLE_ADS_CUSTOMER_ID
        sync: false
      - key: GOOGLE_ADS_LOGIN_CUSTOMER_ID
        sync: false

databases:
  - name: marketing-ai-db
    databaseName: marketing_ai
    user: marketing_user
    region: oregon
    plan: free
